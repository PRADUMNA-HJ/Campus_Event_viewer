spring.application.name=CampusPulse Backend

# Server Port (Binds dynamically to host $PORT, defaults to 8080)
server.port=${PORT:8080}

# Open-in-view setting (prevents OSIV warning)
spring.jpa.open-in-view=false

# ===================================================================
# ACTIVE DEFAULT PROFILE: H2 (File-Based for Local Dev)
# ===================================================================
# Supports standard SPRING_DATASOURCE_* environment variables or falls back to local H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/campuspulse_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Spring Data JPA / Hibernate Configuration (Dialect auto-detected)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Browser UI accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# JWT SECURITY CONFIGURATION
# ===================================================================
# 256-bit+ HMAC-SHA key for signing tokens. In production, override via environment variable JWT_SECRET.
jwt.secret=${JWT_SECRET:campusPulseSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
# Expiration in milliseconds (default: 86400000 ms = 24 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS CONFIGURATION
# ===================================================================
# Comma-separated list of allowed origins. Overridden in production via CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================================================================
# ADMIN BOOTSTRAP CONFIGURATION
# ===================================================================
# Optional credentials to bootstrap an initial administrator account on startup.
# In production, provide ADMIN_BOOTSTRAP_EMAIL and ADMIN_BOOTSTRAP_PASSWORD securely.
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
