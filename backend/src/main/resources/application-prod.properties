# ===================================================================
# POSTGRESQL PRODUCTION PROFILE
# Activated via: --spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod)
# Hardened settings: non-destructive DDL, no SQL logging, strict pool
# ===================================================================

# Server Port (Binds dynamically to host $PORT, defaults to 8080)
server.port=${PORT:8080}

# Database Connection Details
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuspulse_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# HikariCP Connection Pool Settings (Production)
spring.datasource.hikari.pool-name=CampusPulseProdPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Schema Initialization Strategy
# Executes the version-controlled idempotent DDL script (schema-postgres.sql) before Hibernate validation.
# Controlled by SPRING_SQL_INIT_MODE (default: 'always' for automated deployments, or 'never' if pre-applied).
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema-postgres.sql

# JPA / Hibernate (Strict: validate existing schema, never auto-modify in production)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 web console in production
spring.h2.console.enabled=false

# JWT Configuration (In production, JWT_SECRET must be supplied via environment)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Strictly restricted to configured origins in production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Admin Bootstrap Configuration
app.admin.bootstrap.email=${CAMPUSPULSE_ADMIN_EMAIL:${ADMIN_BOOTSTRAP_EMAIL:}}
app.admin.bootstrap.password=${CAMPUSPULSE_ADMIN_PASSWORD:${ADMIN_BOOTSTRAP_PASSWORD:}}

# Production Logging & Error Safety (prevents stack trace / exception leakage)
logging.level.root=WARN
logging.level.com.campuspulse=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
