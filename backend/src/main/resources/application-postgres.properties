# ===================================================================
# POSTGRESQL INTEGRATION & PRODUCTION PROFILE
# Activated via: --spring.profiles.active=postgres (or SPRING_PROFILES_ACTIVE=postgres)
# ===================================================================

# Database Connection Details (Using environment variable overrides with sensible defaults)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuspulse_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 web console when running with PostgreSQL
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:campusPulseSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Admin Bootstrap Configuration
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}


