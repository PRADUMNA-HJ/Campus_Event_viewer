# ===================================================================
# POSTGRESQL DEVELOPMENT & STAGING PROFILE
# Activated via: --spring.profiles.active=postgres (or SPRING_PROFILES_ACTIVE=postgres)
# ===================================================================

# Server Port (Binds dynamically to host $PORT, defaults to 8080)
server.port=${PORT:8080}

# Database Connection Details
# Supports direct SPRING_DATASOURCE_URL or composed from DB_HOST, DB_PORT, DB_NAME
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuspulse_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# HikariCP Connection Pool Settings (Tuned for small/medium campus applications)
spring.datasource.hikari.pool-name=CampusPulseHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA / Hibernate Settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 web console when running with PostgreSQL
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:campusPulseSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Admin Bootstrap Configuration
app.admin.bootstrap.email=${CAMPUSPULSE_ADMIN_EMAIL:${ADMIN_BOOTSTRAP_EMAIL:}}
app.admin.bootstrap.password=${CAMPUSPULSE_ADMIN_PASSWORD:${ADMIN_BOOTSTRAP_PASSWORD:}}
