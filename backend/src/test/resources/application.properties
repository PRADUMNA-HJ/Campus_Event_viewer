# ===================================================================
# AUTOMATED TEST CONFIGURATION (H2 In-Memory)
# Isolates unit & slice tests from local development & production databases
# ===================================================================
spring.application.name=CampusPulse Backend Tests

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Test JWT configuration
jwt.secret=campusPulseSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026
jwt.expiration-ms=86400000

# CORS for tests
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Admin Bootstrap disabled by default during tests (tests manage their own fixtures)
app.admin.bootstrap.email=
app.admin.bootstrap.password=
