services:
  # 1. Spring Boot Backend Web Service (Docker container)
  - type: web
    name: campuspulse-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: campuspulse-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campuspulse-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campuspulse-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: campuspulse-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campuspulse-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # Comma-separated list of allowed CORS origins (no trailing slashes).
      # Includes the production Vercel frontend domain and localhost for local development.
      - key: CORS_ALLOWED_ORIGINS
        value: https://campus-event-viewer.vercel.app,http://localhost:5173
      # Legacy bootstrap env var name (kept for backwards compatibility with application.properties chain)
      # The primary preferred name is CAMPUSPULSE_ADMIN_EMAIL (see below).
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@campuspulse.edu
      # Primary admin bootstrap email (preferred var name read by AdminBootstrapRunner via
      # application.properties: app.admin.bootstrap.email=${CAMPUSPULSE_ADMIN_EMAIL:${ADMIN_BOOTSTRAP_EMAIL:}})
      - key: CAMPUSPULSE_ADMIN_EMAIL
        value: admin@campuspulse.edu
      # IMPORTANT: ADMIN_BOOTSTRAP_PASSWORD and CAMPUSPULSE_ADMIN_PASSWORD must be set as
      # a MANUAL SECRET in the Render dashboard (Environment > Secret Files / Environment Variables).
      # Do NOT use generateValue: true here — a generated password cannot be retrieved and makes
      # the admin account permanently inaccessible after the first deploy.
      # Steps:
      #   1. Open Render dashboard > campuspulse-backend > Environment
      #   2. Add secret variable: CAMPUSPULSE_ADMIN_PASSWORD = <your-chosen-strong-password>
      #   3. Also add:           ADMIN_BOOTSTRAP_PASSWORD  = <same-value> (legacy alias)
      #   4. Save and redeploy.
      # AdminBootstrapRunner is idempotent: it only creates the admin ONCE (single-admin policy).
      # After the first successful deploy, you may remove these vars from the dashboard if desired.

# NOTE: The React frontend is deployed to Vercel (target hosting architecture).
# The redundant Render static frontend service has been removed to avoid duplicate hosting and billing.

databases:
  # 2. Managed PostgreSQL Database
  - name: campuspulse-postgres
    plan: free
    databaseName: campuspulse_db
    user: campuspulse_user
