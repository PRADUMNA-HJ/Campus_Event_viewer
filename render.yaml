services:
  # 1. Spring Boot Backend Web Service (Docker container)
  - type: web
    name: campuspulse-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: campuspulse-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campuspulse-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campuspulse-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: campuspulse-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campuspulse-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # Configure with your actual Vercel domain once frontend is deployed (comma-separated, no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        value: https://campuspulse.vercel.app,http://localhost:5173
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@campuspulse.edu
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true

# NOTE: The React frontend is deployed to Vercel (target hosting architecture).
# The redundant Render static frontend service has been removed to avoid duplicate hosting and billing.

databases:
  # 2. Managed PostgreSQL Database
  - name: campuspulse-postgres
    plan: free
    databaseName: campuspulse_db
    user: campuspulse_user
