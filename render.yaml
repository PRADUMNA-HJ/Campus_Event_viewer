services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: campuspulse-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/campuspulse-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: campuspulse-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: https://campuspulse-frontend.onrender.com,http://localhost:5173
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@campuspulse.edu
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true

  # 2. React Frontend Static Site
  - type: static
    name: campuspulse-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campuspulse-backend.onrender.com/api

databases:
  # 3. Managed PostgreSQL Database
  - name: campuspulse-postgres
    plan: free
    databaseName: campuspulse_db
    user: campuspulse_user
